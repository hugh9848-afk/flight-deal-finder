<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>인천 출발 특가 탐색</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0b1120">
<style>
  :root{
    --bg:#f6f7fb; --card:#fff; --ink:#111827; --muted:#6b7280; --line:#e5e7eb;
    --good:#047857; --goodbg:#ecfdf5; --warn:#b45309; --warnbg:#fffbeb;
    --bad:#b91c1c; --badbg:#fef2f2; --accent:#1d4ed8;
  }
  @media (prefers-color-scheme:dark){
    :root{ --bg:#0b1120; --card:#151c2c; --ink:#e5e7eb; --muted:#9aa4b2; --line:#26304a;
           --good:#34d399; --goodbg:#06281f; --warn:#fbbf24; --warnbg:#2a2008;
           --bad:#f87171; --badbg:#2a1010; --accent:#60a5fa; }
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
       font:15px/1.55 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;
       padding:0 0 40px;-webkit-text-size-adjust:100%}
  /* 머리는 고정하지 않습니다 — 제목부터 필터까지 스크롤과 함께 올라갑니다.
     고정해 두면 폰에서 화면을 가리고, 높이가 바뀔 때 스크롤 이벤트가 서로를 불러 깜빡입니다. */
  header{background:var(--bg);padding:16px 16px 10px;border-bottom:1px solid var(--line)}
  h1{margin:0 0 4px;font-size:19px;letter-spacing:-.02em}
  .sub{color:var(--muted);font-size:12.5px}
  .tabs{display:flex;gap:6px;margin-top:12px}
  .tab{flex:1;padding:8px 6px;border:1px solid var(--line);background:var(--card);color:var(--muted);
       border-radius:9px;font-size:13px;text-align:center;cursor:pointer;font-weight:600}
  .tab[aria-selected="true"]{border-color:var(--accent);color:var(--accent)}
  main{padding:14px 16px;max-width:720px;margin:0 auto}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
  .row{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
  .route{font-size:17px;font-weight:700;letter-spacing:-.02em}
  .price{font-size:19px;font-weight:800;white-space:nowrap}
  .badge{display:inline-block;font-size:11px;font-weight:700;padding:2px 7px;border-radius:99px;margin:0 4px 4px 0}
  .b-ok{background:var(--goodbg);color:var(--good)}
  .b-warn{background:var(--warnbg);color:var(--warn)}
  .b-bad{background:var(--badbg);color:var(--bad)}
  .b-mute{background:var(--bg);color:var(--muted);border:1px solid var(--line)}
  .meta{color:var(--muted);font-size:12.5px;margin-top:2px}
  .leg{border-top:1px solid var(--line);margin-top:10px;padding-top:9px;font-size:13px}
  .leg b{font-weight:700}
  .seg{color:var(--muted);font-size:12px;margin-left:10px}
  .lay{color:var(--warn);font-size:12px;margin-left:10px}
  .warn{background:var(--warnbg);color:var(--warn);border-radius:8px;padding:7px 9px;font-size:12.5px;margin-top:8px}
  .score{font-size:12px;color:var(--muted)}
  .bar{height:5px;background:var(--line);border-radius:99px;overflow:hidden;margin-top:5px;width:110px}
  .bar>i{display:block;height:100%;background:var(--accent)}
  .empty{text-align:center;color:var(--muted);padding:44px 16px;font-size:14px}
  .note{font-size:12px;color:var(--muted);margin-top:18px;line-height:1.6;border-top:1px solid var(--line);padding-top:12px}
  details{margin-top:8px} summary{font-size:12.5px;color:var(--accent);cursor:pointer}
  code{font-size:11.5px;background:var(--bg);padding:1px 4px;border-radius:4px}
  .code{font-size:12px;color:var(--muted);font-weight:600;letter-spacing:.02em}
  .basis{font-size:11px;color:var(--muted);border:1px solid var(--line);border-radius:99px;padding:1px 6px;margin-left:2px}
  .filters{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
  /* 고르기를 마치면 단추 무더기 대신 '지금 어디' 만 한 줄로 남깁니다.
     그 줄의 각 칸을 누르면 그 단계 단추가 다시 펼쳐집니다. */
  .crumb{display:flex;align-items:center;gap:4px;flex-wrap:wrap;margin-top:10px;font-size:12.5px}
  .crumb button{border:0;background:none;padding:4px 2px;font:inherit;cursor:pointer;
                color:var(--muted);font-weight:600}
  .crumb button.here{color:var(--accent);text-decoration:underline;text-underline-offset:3px}
  .crumb .sep{color:var(--line)}
  .crumb .cnt{color:var(--muted);font-weight:400}
  .chip{padding:5px 10px;border:1px solid var(--line);background:var(--card);color:var(--muted);
        border-radius:99px;font-size:12px;cursor:pointer;font-weight:600;white-space:nowrap}
  .chip[aria-pressed="true"]{border-color:var(--accent);color:var(--accent)}
  /* 나라 줄: 지역 줄보다 한 단 작게 해서 '하위 단계'임을 눈으로 알 수 있게 합니다 */
  .filters.sub{margin-top:6px;padding-left:8px;border-left:2px solid var(--line);gap:5px}
  .filters.sub .chip{font-size:11.5px;padding:4px 9px;font-weight:600}
  .filters.sub:empty{display:none}
  .more{display:block;width:100%;padding:12px;margin-top:4px;border:1px solid var(--line);
        background:var(--card);color:var(--accent);border-radius:10px;font-size:14px;font-weight:700;cursor:pointer}
  .verify{display:block;margin-top:10px;padding:11px 12px;background:var(--accent);color:#fff;
          border-radius:10px;text-align:center;font-weight:700;font-size:14px;text-decoration:none}
  .verify:active{opacity:.85}
  .verify small{display:block;font-weight:400;font-size:11.5px;opacity:.85;margin-top:2px}
</style>
</head>
<body>
<header>
  <h1>인천 출발 특가 탐색</h1>
  <div class="sub" id="sub">불러오는 중…</div>
  <div class="tabs" role="tablist">
    <div class="tab" role="tab" data-tab="deals" aria-selected="true">확정 특가 <span id="n1"></span></div>
    <div class="tab" role="tab" data-tab="review" aria-selected="false">확인 필요 <span id="n2"></span></div>
  </div>
  <div class="filters" id="filters"></div>
  <div class="filters sub" id="countryFilters"></div>
</header>
<main id="list"><div class="empty">불러오는 중…</div></main>

<script>
const won = n => typeof n === "number" ? n.toLocaleString("ko-KR")+"원" : "미확인";
const hm  = m => typeof m === "number" ? `${Math.floor(m/60)}시간 ${m%60}분` : "미확인";
const dt  = s => s ? s.slice(0,16).replace("T"," ") : "미확인";
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

// 가격이 어느 단계까지 확인된 것인지 딱지를 붙입니다.
const priceBadge = t => ({
  confirmed:['b-ok','확정가'],
  live:['b-warn','조회가(미확정)'],
  indicative:['b-mute','참고가(캐시)'],
}[t] ?? ['b-mute', t ?? '?']);

/** 이름을 알면 "이스탄불 (IST)", 모르면 코드만 보여줍니다. */
function place(name, code){
  if (!code) return "?";
  return name?.city ? `${esc(name.city)} <span class="code">${esc(code)}</span>` : esc(code);
}

function legHtml(leg, label){
  if(!leg) return "";
  const segs = (leg.segments ?? []).map(s => {
    const lay = typeof s.layoverMin === "number"
      ? `<div class="lay">└ ${s.to} 경유 대기 ${hm(s.layoverMin)}${s.airportChange ? " · ⚠ 공항 변경" : ""}</div>` : "";
    return `<div class="seg">${esc(s.number)} ${esc(s.from)}${s.fromTerminal?`(T${esc(s.fromTerminal)})`:""} `
         + `${dt(s.departAt)} → ${esc(s.to)}${s.toTerminal?`(T${esc(s.toTerminal)})`:""} ${dt(s.arriveAt)} · ${hm(s.durationMin)}</div>${lay}`;
  }).join("");
  return `<div class="leg"><b>${label}</b> ${dt(leg.departAt)} · ${leg.durationMin != null ? `총 ${hm(leg.durationMin)} · ` : "이동시간 미확인 · "}${leg.stops === null || leg.stops === undefined ? "경유 미확인" : `경유 ${leg.stops}회`}${segs}</div>`;
}

/**
 * '눌러서 실제 가격 확인' 버튼.
 * 이 앱은 실제 운임을 자동으로 확정하지 못하므로,
 * 마지막 확인은 사람이 이 버튼 한 번으로 합니다.
 */
function verifyLink(d){
  const link = (d.links ?? [])[0];
  const url = link?.url;
  if (!url || !/^https?:\/\//i.test(url)) return "";
  return `<a class="verify" href="${esc(url)}" target="_blank" rel="noopener noreferrer">`
       + `눌러서 실제 가격 확인`
       + `<small>${esc(link.label ?? "같은 조건으로 다시 확인합니다")}</small></a>`;
}

function cardHtml(d){
  const [cls,txt] = priceBadge(d.priceType);
  const badges = [`<span class="badge ${cls}">${txt}</span>`];
  if (d.openJaw) badges.push(`<span class="badge b-mute">오픈조</span>`);
  if (d.separateTickets) badges.push(`<span class="badge b-bad">별도 발권</span>`);
  if (d.selfTransfer) badges.push(`<span class="badge b-bad">자가환승</span>`);
  if (d.airportChange) badges.push(`<span class="badge b-warn">공항 변경</span>`);
  if (d.fareRules?.conflict) badges.push(`<span class="badge b-bad">값 불일치</span>`);
  if (d.outOfRange) badges.push(`<span class="badge b-warn">기간 경계 밖</span>`);
  if (d.tripDaysBasis === "local_departure_estimated") badges.push(`<span class="badge b-mute">일수 어림값</span>`);
  if (d.tripDaysBasis === "arrival_time_derived") badges.push(`<span class="badge b-mute">도착시각 계산값</span>`);
  if (d.departureAirportVerified !== true) badges.push(`<span class="badge b-warn">출국 공항 미확인</span>`);
  if (d.returnAirportVerified !== true) badges.push(`<span class="badge b-warn">귀국 공항 미확인</span>`);
  if (typeof d.seatsLeft === "number" && d.seatsLeft <= 3) badges.push(`<span class="badge b-warn">잔여 ${d.seatsLeft}석</span>`);

  const bg = d.baggage
    ? `위탁 ${d.baggage.checkedPieces ?? "?"}개${d.baggage.checkedKg?` (${d.baggage.checkedKg}kg)`:""} · 기내 ${d.baggage.cabinKg ?? "?"}kg`
    : "수하물 미확인";
  const refund = d.fareRules
    ? (d.fareRules.refundable === true ? "환불 가능" : d.fareRules.refundable === false ? "환불 불가" : "환불 조건 미확인")
    : "환불 조건 미확인";

  const v = d.verdict ?? {};
  const disc = v.discountPct !== null && v.discountPct !== undefined
    ? `${v.basis === "same_scan" ? "이번 검색 비교값 대비" : "기준가 대비"} <b>${Math.abs(v.discountPct)}%</b> ${v.discountPct < 0 ? "높음" : "낮음"}` : "할인율 미확인";
  const conf = {high:"높음",medium:"보통",low:"낮음",none:"없음"}[v.confidence] ?? "?";
  // 이 할인율이 무엇을 기준으로 나온 값인지 분명히 밝힙니다
  const basisLabel = {
    google_deals_reported:             "Google 이 알려준 평소가 대비",
    app_computed_from_google_history:  "Google 가격이력으로 앱이 계산",
    self_observed:                     "이 앱이 모아온 값 대비",
    same_scan:                         "이번 검색 안에서 비교",
    none:                              "비교 기준 없음",
  }[v.basis] ?? "";
  const obs = (v.observationDays != null && v.distinctDays != null)
    ? ` · ${v.observationDays}일에 걸쳐 ${v.distinctDays}일 관측` : "";

  const ground = d.ground
    ? `<div class="meta">🚆 ${esc(d.ground.fromCity)}→${esc(d.ground.toCity)} ${esc(d.ground.mode)} 약 ${won(d.ground.estCostKRW)} / ${d.ground.estHours}시간 <span class="badge b-warn">추정</span></div>`
    : "";

  const warns = (d.warnings ?? []).map(w => `<div class="warn">⚠ ${esc(w)}</div>`).join("");
  const reason = d.statusReason ? `<div class="warn">🔍 ${esc(d.statusReason)}</div>` : "";
  const unknown = (d.unknown ?? []).length
    ? `<div class="meta">미확인 항목: ${d.unknown.map(esc).join(", ")}</div>` : "";

  return `<article class="card">
    <div class="row">
      <div>
        <div class="route">${place(d.originName, d.originOut)} → ${place(d.destInName, d.destIn)}</div>
        ${d.destOut && d.destOut !== d.destIn
          ? `<div class="meta">귀국은 ${place(d.destOutName, d.destOut)} 에서 출발</div>` : ""}
        <div class="meta">${esc(d.destInName?.country ?? "")}</div>
        <div class="meta">${d.tripDaysRange ? `${d.tripDaysRange[0]}~${d.tripDaysRange[1]}일 중 선택` : `${d.tripDays ?? "?"}일 일정`}${d.usableDays!=null?` · 실제 체류 약 ${d.usableDays}일`:""}</div>
      </div>
      <div style="text-align:right">
        <div class="price">${won(d.total)}</div>
        <div class="meta">항공료 ${won(d.base)} + 세금 ${won(d.taxes)}</div>
        ${d.totalTripCostKRW && d.totalTripCostKRW!==d.total ? `<div class="meta">육로 포함 ${won(d.totalTripCostKRW)}</div>`:""}
      </div>
    </div>
    <div style="margin-top:8px">${badges.join("")}</div>
    <div class="meta">${disc}${basisLabel ? ` <span class="basis">${esc(basisLabel)}</span>` : ""}</div>
    <div class="meta">판정 신뢰도 <b>${conf}</b> · 표본 ${v.sampleSize ?? 0}건${obs}</div>
    ${d.providerRange ? `<div class="meta">Google 통상 가격대 ${d.providerRange.range.map(n=>n.toLocaleString("ko-KR")).join(" ~ ")}원</div>` : ""}
    ${v.selfObserved ? `<div class="meta">참고 · 이 앱 관측으로는 ${v.selfObserved.discountPct}% (표본 ${v.selfObserved.sampleSize}건)</div>` : ""}
    <div class="score">여행가치 ${d.score ?? "?"}점<div class="bar"><i style="width:${Math.max(0,Math.min(100,d.score??0))}%"></i></div></div>
    ${legHtml(d.outbound,"출국")}
    ${legHtml(d.inbound,"귀국")}
    <div class="meta" style="margin-top:8px">🧳 ${esc(bg)} · ${esc(refund)}</div>
    ${ground}${unknown}${reason}${warns}
    ${verifyLink(d)}
    <details><summary>판정 근거 보기</summary>
      <div class="meta">${esc(v.reason ?? "-")}</div>
      <div class="meta">기준값 ${won(v.baseline)} · 방식 <code>${esc(v.method ?? "-")}</code>${v.zScore!=null?` · z=${v.zScore}`:""}</div>
      <div class="meta">조회 시각 ${dt(d.fetchedAt)} · 출처 <code>${esc(d.source)}</code></div>
      ${(d.notes??[]).map(n=>`<div class="meta">· ${esc(n)}</div>`).join("")}
    </details>
  </article>`;
}

let DATA = null, TAB = "deals", SHOWN = 30, FILTER = "all";
let COUNTRY = null;   // 고른 나라 이름. null 이면 그 지역 전부를 봅니다
// 지금 어느 단계 단추를 펼쳐 두었나: "region"(지역) | "country"(나라) | null(경로만)
let OPEN = "region";
const PAGE = 30;   // 한 번에 보여줄 개수 (폰에서 248개를 한꺼번에 그리면 버겁습니다)

/** 지역 이름 (나라 이름으로 대충 묶습니다) */
const REGION_OF = {
  "튀르키예":"유럽","조지아":"캅카스","아르메니아":"캅카스","아제르바이잔":"캅카스","몽골":"몽골",
  "호주":"오세아니아","뉴질랜드":"오세아니아",
};
function regionOf(d){
  const region = { europe: "유럽", africa: "아프리카", caucasus: "캅카스",
                   mongolia: "몽골", oceania: "오세아니아" }[d.region];
  if(region) return region;
  // 여기부터는 지역 값이 없는 옛 결과를 나라 이름으로 되짚는 자리입니다.
  const country = d.destInName?.country;
  if(!country) return "기타";
  if(REGION_OF[country]) return REGION_OF[country];
  const africa = ["이집트","모로코","튀니지","알제리","에티오피아","케냐","탄자니아","남아공",
                  "짐바브웨","나미비아","나이지리아","가나","세네갈","모리셔스","세이셸"];
  return africa.includes(country) ? "아프리카" : "유럽";
}

/** 나라 이름을 꺼냅니다 (없으면 "기타") */
function countryOf(d){ return d.destInName?.country ?? "기타"; }

/** 지역만 걸러낸 목록 (나라 칩을 만들 때 씁니다) */
function itemsInRegion(){
  const base = TAB === "deals" ? DATA.deals : DATA.needsReview;
  if(FILTER === "all") return base;
  if(FILTER === "deal") return base.filter(x => x.verdict?.isDeal);
  return base.filter(x => regionOf(x) === FILTER);
}

/** 화면에 보여줄 최종 목록 = 지역으로 거른 뒤, 나라를 골랐으면 한 번 더 거릅니다 */
function currentItems(){
  const list = itemsInRegion();
  if(!COUNTRY) return list;
  return list.filter(x => countryOf(x) === COUNTRY);
}

function renderFilters(){
  if(!DATA) return;
  const base = TAB === "deals" ? DATA.deals : DATA.needsReview;
  const path = document.getElementById("filters");        // 경로 줄
  const box  = document.getElementById("countryFilters"); // 단추 무더기

  // 지역별·나라별 건수를 미리 셉니다
  const regionCount = new Map();
  for(const x of base){ const r = regionOf(x); regionCount.set(r, (regionCount.get(r) ?? 0) + 1); }
  const inRegion = itemsInRegion();
  const countryCount = new Map();
  for(const x of inRegion){ const c = countryOf(x); countryCount.set(c, (countryCount.get(c) ?? 0) + 1); }
  // 고른 나라가 이번 결과에 없어졌으면 풀어줍니다
  if(COUNTRY && !countryCount.has(COUNTRY)) COUNTRY = null;

  // ── 경로 줄: 전체보기 › 유럽 › 이탈리아 ──
  // 누르면 그 단계 단추가 다시 펼쳐집니다.
  const crumbs = [["all", "전체보기", FILTER === "all"]];
  if(FILTER === "deal") crumbs.push(["deal", "특가만", true]);
  else if(FILTER !== "all") crumbs.push(["region", FILTER, OPEN === "region"]);
  if(COUNTRY) crumbs.push(["country", COUNTRY, OPEN === "country"]);
  path.className = "crumb";
  path.innerHTML = crumbs.map(([k,label,here], i) =>
      (i ? '<span class="sep">›</span>' : "")
      + `<button data-open="${esc(k)}" class="${here ? "here" : ""}">${esc(label)}</button>`).join("")
    + ` <span class="cnt">${currentItems().length}건</span>`;

  // ── 단추 무더기: 지금 열어 둔 단계만 ──
  if(OPEN === "region"){
    const chips = [
      ["all", `전체 ${base.length}`],
      ["deal", `특가만 ${base.filter(x=>x.verdict?.isDeal).length}`],
      ...[...regionCount.keys()].sort().map(r => [r, `${r} ${regionCount.get(r)}`]),
    ];
    box.className = "filters";
    box.innerHTML = chips.map(([k,label]) =>
      `<button class="chip" data-f="${esc(k)}" aria-pressed="${FILTER===k}">${esc(label)}</button>`).join("");
  } else if(OPEN === "country" && countryCount.size >= 2){
    // 건수가 많은 나라부터 (같으면 가나다순)
    const sorted = [...countryCount.entries()]
      .sort((a,b) => b[1]-a[1] || a[0].localeCompare(b[0], "ko"));
    const label = FILTER === "deal" ? "나라 전부" : `${FILTER} 전부`;
    box.className = "filters sub";
    box.innerHTML =
      `<button class="chip" data-c="" aria-pressed="${COUNTRY===null}">${esc(label)} ${inRegion.length}</button>`
      + sorted.map(([c,n]) =>
          `<button class="chip" data-c="${esc(c)}" aria-pressed="${COUNTRY===c}">${esc(c)} ${n}</button>`).join("");
  } else {
    box.className = "filters";
    box.innerHTML = "";   // 고르기를 마쳤으면 경로 줄만 남습니다
  }
}

function render(){
  const list = document.getElementById("list");
  if(!DATA){ list.innerHTML = `<div class="empty">데이터를 불러오지 못했습니다.</div>`; return; }
  renderFilters();
  const items = currentItems();
  if(!items.length){
    list.innerHTML = `<div class="empty">${TAB==="deals"
      ? "이번 스캔에서 확정된 특가가 없습니다.<br>확인 필요 탭을 살펴보세요."
      : "조건에 맞는 후보가 없습니다."}</div>`;
    return;
  }
  const page = items.slice(0, SHOWN);
  list.innerHTML = page.map(cardHtml).join("")
    + (items.length > SHOWN
        ? `<button class="more" id="more">${items.length - SHOWN}건 더 보기</button>` : "")
    + `<div class="note">${esc(DATA.disclaimer ?? "")}</div>`;
  const more = document.getElementById("more");
  if(more) more.addEventListener("click", () => { SHOWN += PAGE; render(); });
}

fetch("data/deals.json?t=" + Date.now())
  .then(r => r.json())
  .then(d => {
    DATA = d;
    const r = d.report ?? {};
    document.getElementById("sub").textContent =
      // 출처(serpapi/travelpayouts)는 머리에서 뺐습니다 — 늘 같은 값이라 자리만 먹습니다.
      // 건별 출처는 각 카드의 '판정 근거 보기' 안에 그대로 있습니다.
      `${(d.generatedAt ?? "").slice(0,16).replace("T"," ")} 기준 · ${r.window?.departFrom ?? "?"}~${r.window?.departTo ?? "?"} 출발 · 목적지 ${r.destinationCount ?? "?"}곳`;
    document.getElementById("n1").textContent = d.deals.length;
    document.getElementById("n2").textContent = d.needsReview.length;
    render();
  })
  .catch(() => { document.getElementById("sub").textContent = "아직 스캔 결과가 없습니다."; render(); });

document.querySelectorAll(".tab").forEach(t => t.addEventListener("click", () => {
  document.querySelectorAll(".tab").forEach(x => x.setAttribute("aria-selected", String(x === t)));
  TAB = t.dataset.tab; SHOWN = PAGE; FILTER = "all"; COUNTRY = null; OPEN = "region"; render();
}));


// 경로 줄 (전체보기 › 유럽 › 이탈리아) — 누른 칸의 단추를 다시 펼칩니다
document.getElementById("filters").addEventListener("click", (e) => {
  const b = e.target.closest("button[data-open]");
  if(!b) return;
  const at = b.dataset.open;
  if(at === "all" || at === "deal"){
    // '전체보기' 를 누르면 처음으로 돌아갑니다
    if(at === "all"){ FILTER = "all"; COUNTRY = null; }
    OPEN = "region";
  } else if(at === "region"){
    OPEN = "region";          // 지역을 다시 고르려는 것
  } else {
    OPEN = "country";         // 나라를 다시 고르려는 것
  }
  SHOWN = PAGE; render();
});

// 단추 무더기 — 지역이든 나라든 여기서 고릅니다
document.getElementById("countryFilters").addEventListener("click", (e) => {
  const b = e.target.closest(".chip");
  if(!b) return;
  if(b.dataset.f !== undefined){
    // 지역을 골랐다 → 나라 단추로 넘어갑니다
    FILTER = b.dataset.f;
    COUNTRY = null;
    OPEN = (FILTER === "all") ? "region" : "country";
  } else {
    // 나라를 골랐다 → 고르기를 마쳤으므로 경로 줄만 남깁니다
    COUNTRY = b.dataset.c || null;
    OPEN = COUNTRY ? null : "country";
  }
  SHOWN = PAGE; render();
});

if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
</body>
</html>
