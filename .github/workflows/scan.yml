# 3일에 한 번 자동으로 특가를 찾고, 결과를 공개 사이트에 올립니다.
# API 키는 GitHub 금고(Secrets)에만 있고 사이트에는 절대 올라가지 않습니다.
name: 특가 스캔

on:
  schedule:
    - cron: "0 21 */3 * *"   # 한국시간 오전 6시, 3일마다
  workflow_dispatch:          # 손으로도 돌릴 수 있게
    inputs:
      regions:
        description: "탐색 지역 (비우면 전체). 예: europe,caucasus"
        required: false
        default: ""

permissions:
  contents: write   # 가격 이력을 저장소에 다시 저장하기 위해
  pages: write
  id-token: write

concurrency:
  group: flight-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: 시험 통과 확인
        run: npm test

      - name: 특가 스캔 실행
        env:
          TRAVELPAYOUTS_TOKEN: ${{ secrets.TRAVELPAYOUTS_TOKEN }}
          TRAVELPAYOUTS_MARKER: ${{ secrets.TRAVELPAYOUTS_MARKER }}
          NOTIFY_WEBHOOK_URL: ${{ secrets.NOTIFY_WEBHOOK_URL }}
        run: node src/cli.js scan --provider=travelpayouts --regions="${{ inputs.regions }}"

      - name: 결과를 실행 요약에 표시
        if: always()
        run: |
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat web/data/summary.txt >> $GITHUB_STEP_SUMMARY 2>/dev/null || echo "요약 없음" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: 가격 이력과 결과를 저장소에 되돌려 저장
        run: |
          git config user.name "flight-deal-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/history data/alert-state.json web/data
          if git diff --staged --quiet; then
            echo "바뀐 내용 없음"
          else
            git commit -m "스캔 결과 갱신 $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: web
      - id: deployment
        uses: actions/deploy-pages@v5
