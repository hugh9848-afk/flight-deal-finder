# 3일에 한 번 자동으로 특가를 찾고, 결과를 공개 사이트에 올립니다.
# API 키는 GitHub 금고(Secrets)에만 있고 사이트에는 절대 올라가지 않습니다.
name: 특가 스캔

on:
  schedule:
    - cron: "0 21 */3 * *"   # 한국시간 오전 6시, 3일마다

  # 코드를 고쳐 올리면 곧바로 다시 돌려 사이트에 반영합니다.
  # 단, 이 워크플로우가 스스로 저장하는 폴더(data/, web/data/)는 무시합니다.
  # 안 그러면 '실행 -> 결과 커밋 -> 그 커밋이 또 실행' 으로 끝없이 돕니다.
  push:
    branches: [main]
    paths-ignore:
      - "data/**"
      - "web/data/**"
      - "README.md"

  workflow_dispatch:          # 손으로도 돌릴 수 있게
    inputs:
      regions:
        description: "탐색 지역 (비우면 전체). 예: europe,caucasus"
        required: false
        default: ""

permissions:
  contents: write   # 가격 이력을 저장소에 다시 저장하기 위해
  issues: write     # 새 특가 후보를 이슈로 올려 휴대폰 알림을 받기 위해
  pages: write
  id-token: write

concurrency:
  group: flight-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: 시험 통과 확인
        run: npm test

      - name: 특가 스캔 실행
        env:
          TRAVELPAYOUTS_TOKEN: ${{ secrets.TRAVELPAYOUTS_TOKEN }}
          TRAVELPAYOUTS_MARKER: ${{ secrets.TRAVELPAYOUTS_MARKER }}
          NOTIFY_WEBHOOK_URL: ${{ secrets.NOTIFY_WEBHOOK_URL }}
          SITE_URL: https://hugh9848-afk.github.io/flight-deal-finder/
        run: node src/cli.js scan --provider=travelpayouts --regions="${{ inputs.regions }}"

      # 새 후보가 있으면 이슈로 올립니다.
      # 휴대폰 GitHub 앱이 이 순간 푸시 알림을 띄웁니다.
      # 별도 계정·토큰이 필요 없고, 지난 알림이 목록으로 남습니다.
      - name: 새 후보를 이슈로 알리기
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          COUNT=$(node -e "try{console.log(JSON.parse(require('fs').readFileSync('web/data/alerts.json','utf8')).count)}catch{console.log(0)}")
          echo "알릴 후보: $COUNT 건"
          if [ "$COUNT" -gt 0 ]; then
            node -e "console.log(JSON.parse(require('fs').readFileSync('web/data/alerts.json','utf8')).text)" > /tmp/alert.md
            TITLE="✈️ 인천 출발 특가 후보 ${COUNT}건 ($(TZ=Asia/Seoul date +%m/%d))"
            gh issue create --title "$TITLE" --body-file /tmp/alert.md
          else
            echo "새로 알릴 것이 없습니다"
          fi

      - name: 결과를 실행 요약에 표시
        if: always()
        run: |
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat web/data/summary.txt >> $GITHUB_STEP_SUMMARY 2>/dev/null || echo "요약 없음" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: 가격 이력과 결과를 저장소에 되돌려 저장
        run: |
          git config user.name "flight-deal-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/history data/alert-state.json web/data
          if git diff --staged --quiet; then
            echo "바뀐 내용 없음"
          else
            git commit -m "스캔 결과 갱신 $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: web
      - id: deployment
        uses: actions/deploy-pages@v5
